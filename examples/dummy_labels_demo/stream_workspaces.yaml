# Resonance sweep analysis for the 3-channel dummy trace device.
#
# The comments and the flow-style lines below are here on purpose: saving
# this store from the DAG modal should leave every one of them alone.
version: 1
workspaces:
  - workspace_id: workspace-1
    name: Resonance Sweep
    enabled: true
    graph:
      nodes:
        # --- source: all three channels, averaged ---
        - node_id: src
          op: source.stream
          params: {device_id: trace1, stream: trace, channel_mode: average, channel_index: 0, channel_indices: "0,1,2"}

        # --- baseline subtract, then integrate the pulse ---
        - node_id: bg
          op: trace.subtract_background
          inputs: {trace: src}
          params: {bg_start_idx: 0, bg_stop_idx: 250}

        - node_id: integral
          op: trace.integrate
          inputs: {trace: bg}
          params: {}

        # --- scan axis ---
        - node_id: ctx_x
          op: source.context_field
          params: {field: freq_hz}

        # --- histogram vs frequency, then a gaussian fit ---
        - node_id: bin
          op: aggregate.bin_stats
          inputs: {x: ctx_x, y: integral}
          params: {auto_range: true, x_min: -15000000, x_max: 15000000, bin_count: 30}

        # every_n counts incoming traces, not bins: at ~8 frames/s this
        # refits roughly every 1.3 s. Drop it to 1 to see the fit track
        # the histogram frame for frame.
        - node_id: node_6
          op: fit.from_hist_agg
          inputs: {hist: bin}
          params: {y_source: mean, model: gaussian, baseline_mode: none, every_n: 10, dense_eval_points: 200, chi2_sigma_source: sem, min_count: 1}

        - node_id: node_7
          op: fit.yhat
          inputs: {fit: node_6}
          params: {}

        - node_id: node_8
          op: fit.params
          inputs: {fit: node_6}
          params: {}

    publish:
      outputs:
        # Labelled outputs: the name a person reads on the plot card.
        - {output_id: bin_stats, node_id: bin,      label: Resonance vs frequency}
        - {output_id: integral,  node_id: integral, label: Pulse integral}

        # The fit itself. fit_1d carries x, yhat and the dense grid
        # together, so the plot card can place a stale curve correctly —
        # bind this one to "Overlay fits", not the bare yhat below.
        - {output_id: fit_1d,    node_id: node_6, label: Gaussian fit}

        # Unlabelled: the UI derives a name from the id instead.
        - {output_id: fit_curve, node_id: node_7}
        - {output_id: out_3,     node_id: bg}
        - {output_id: out_4,     node_id: node_7}
        - {output_id: out_5,     node_id: node_8}
