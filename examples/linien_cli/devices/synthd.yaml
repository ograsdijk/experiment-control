version: 1

device_id: SynthHD
telemetry_period_s: 1.0

driver:
  module: experiment_control.drivers.synthhd_driver
  class_name: SynthHD

init_kwargs:
  port: COM4

telemetry_calls:
  - method: get_enable
    kwargs: {channel: 0}
    outputs:
      - signal: ch1_output_enabled
        kind: scalar
        units: ""
        dtype: bool
  - method: get_frequency
    kwargs: {channel: 0}
    outputs:
      - signal: ch1_frequency_hz
        kind: scalar
        units: "Hz"
        dtype: float64
  - method: get_power
    kwargs: {channel: 0}
    outputs:
      - signal: ch1_power_dbm
        kind: scalar
        units: "dBm"
        dtype: float64
  - method: get_enable
    kwargs: {channel: 1}
    outputs:
      - signal: ch2_output_enabled
        kind: scalar
        units: ""
        dtype: bool
  - method: get_frequency
    kwargs: {channel: 1}
    outputs:
      - signal: ch2_frequency_hz
        kind: scalar
        units: "Hz"
        dtype: float64
  - method: get_power
    kwargs: {channel: 1}
    outputs:
      - signal: ch2_power_dbm
        kind: scalar
        units: "dBm"
        dtype: float64
