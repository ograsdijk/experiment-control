version: 1
process_id: laser_lock_freq_nltl_power
process:
  file: examples/linien_cli/processes/laser_lock_freq_nltl_power.py
  class_name: LaserLockFreqNltlPowerFollower
init_kwargs:
  rpc_timeout_ms: 2000
  rules:
    - name: step_guard_laser_ch1
      device_id: SynthHD
      trigger_action: set_frequency
      channel: 1
      trigger_param: freq_hz
      max_step_hz: 5000000
      current_freq_signal: ch1_frequency_hz
      telemetry_max_age_s: 2.0
      csv_path: 2024_2_7_NLTL_powerscan_5MHzstep.csv
      freq_col: 0
      power_col: 1
      effects: []
    - name: power_setter_laser_ch1
      device_id: SynthHD
      trigger_action: set_frequency
      channel: 1
      trigger_param: freq_hz
      csv_path: 2024_2_7_NLTL_powerscan_5MHzstep.csv
      freq_col: 0
      power_col: 1
      effects:
        - action: set_power
          param: dbm
          channel: 1
    - name: step_guard_laser_ch2
      device_id: SynthHD
      trigger_action: set_frequency
      channel: 2
      trigger_param: freq_hz
      max_step_hz: 5000000
      current_freq_signal: ch2_frequency_hz
      telemetry_max_age_s: 2.0
      csv_path: 2024_2_15_NLTL2_powerscan_5MHzstep.csv
      freq_col: 0
      power_col: 1
      effects: []
    - name: power_setter_laser_ch2
      device_id: SynthHD
      trigger_action: set_frequency
      channel: 2
      trigger_param: freq_hz
      csv_path: 2024_2_15_NLTL2_powerscan_5MHzstep.csv
      freq_col: 0
      power_col: 1
      effects:
        - action: set_power
          param: dbm
          channel: 2
restart_policy: NEVER
heartbeat_timeout_s: 3.0
shutdown_timeout_s: 3.0
