name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every check lives in scripts/ci_check.py; each job runs one `--job` of it.
# A local `python scripts/ci_check.py --full` therefore runs exactly what CI
# runs -- add or change checks there, not here.

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync, lint, complexity guard, tests, wheel
        run: python scripts/ci_check.py --job python

  ui_validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/react_ui/.nvmrc
          cache: npm
          cache-dependency-path: web/react_ui/package-lock.json

      - name: Build UI, run UI tests, verify packaged UI is current
        run: python scripts/ci_check.py --job ui

  windows_lifecycle_smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run Windows lifecycle smoke test
        run: python scripts/ci_check.py --job smoke
