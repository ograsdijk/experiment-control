name: One-shot watchdog PR fix

on:
  push:
    branches:
      - watchdog-independent-hornets

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: watchdog-independent-hornets
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/react_ui/package-lock.json
      - name: Apply watchdog action-result status fixes
        shell: pwsh
        run: |
          $patch = @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"patch anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def insert_before_once(path: str, marker: str, addition: str, sentinel: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if sentinel in text:
                  return
              if marker not in text:
                  raise RuntimeError(f"insert marker not found in {path}: {marker!r}")
              p.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          # Backend: persist the latest action-chain lifecycle/result in RuleState and status.
          replace_once(
              "src/experiment_control/processes/watchdog.py",
              "    active_trip_id: str | None = None\n    active_trip_recovered: bool = False\n    # Per-alias state permits an ``any_sample_aliases`` guard to require a\n",
              "    active_trip_id: str | None = None\n    active_trip_recovered: bool = False\n    # Most recent remediation chain. This intentionally survives recovery/latch\n    # clearing so operators can see whether the last safety action fully ran.\n    last_action_chain: Json | None = None\n    # Per-alias state permits an ``any_sample_aliases`` guard to require a\n",
          )
          replace_once(
              "src/experiment_control/processes/watchdog.py",
              "    ) -> None:\n        try:\n            future = self._action_executor.submit(\n",
              "    ) -> None:\n        state = self._states[key]\n        state.last_action_chain = {\n            \"trip_id\": trip_id,\n            \"state\": \"running\",\n            \"success\": None,\n            \"action_count\": len(rule.actions),\n            \"succeeded_actions\": 0,\n            \"failed_actions\": 0,\n            \"actions\": [],\n        }\n        try:\n            future = self._action_executor.submit(\n",
          )
          replace_once(
              "src/experiment_control/processes/watchdog.py",
              "        except RuntimeError:\n            # Executor was shut down (e.g. during graceful stop). Drop\n            # the in-flight marker so a future tick can re-trigger\n            # cleanly if the watchdog comes back online.\n            with self._inflight_lock:\n                self._inflight_action_keys.discard(key)\n            self._publish_event(\n",
              "        except RuntimeError:\n            # Executor was shut down (e.g. during graceful stop). Persist the\n            # failed submission so status does not misleadingly retain an older\n            # successful action chain.\n            state.last_action_chain = {\n                \"trip_id\": trip_id,\n                \"state\": \"error\",\n                \"success\": False,\n                \"action_count\": len(rule.actions),\n                \"succeeded_actions\": 0,\n                \"failed_actions\": len(rule.actions),\n                \"actions\": [],\n                \"error\": \"action executor is unavailable\",\n            }\n            # Drop the in-flight marker so a future tick can re-trigger cleanly\n            # if the watchdog comes back online.\n            with self._inflight_lock:\n                self._inflight_action_keys.discard(key)\n            self._publish_event(\n",
          )
          replace_once(
              "src/experiment_control/processes/watchdog.py",
              "    def _on_action_chain_done(\n        self, future: Future[Json], key: tuple[str, str], trip_id: str\n    ) -> None:\n        with self._inflight_lock:\n            self._inflight_action_keys.discard(key)\n        # Surface a worker-thread exception that escaped _execute_actions\n        # (it catches per-action failures, so this is an unexpected\n        # internal error path). Publish via the manager event bus so the\n        # supervisor's log captures it.\n        try:\n            future.result()\n        except Exception as exc:\n            try:\n                self._publish_event(\n                    \"manager.watchdog.action_chain_error\",\n                    {\n                        \"process_id\": self._process_id,\n                        \"trip_id\": trip_id,\n                        \"watchdog_id\": key[0],\n                        \"rule\": key[1],\n                        \"error\": repr(exc),\n                    },\n                )\n            except Exception:\n                pass\n",
              "    def _on_action_chain_done(\n        self, future: Future[Json], key: tuple[str, str], trip_id: str\n    ) -> None:\n        # Keep the rule marked in-flight until its result has been persisted.\n        # Otherwise a new trip can be submitted in the tiny window between\n        # removing the marker and recording the previous completion, allowing\n        # the older callback to overwrite the new chain's \"running\" state.\n        state = self._states.get(key)\n        try:\n            summary = future.result()\n            if (\n                state is not None\n                and isinstance(state.last_action_chain, dict)\n                and state.last_action_chain.get(\"trip_id\") == trip_id\n            ):\n                state.last_action_chain = {**summary, \"state\": \"completed\"}\n        except Exception as exc:\n            if (\n                state is not None\n                and isinstance(state.last_action_chain, dict)\n                and state.last_action_chain.get(\"trip_id\") == trip_id\n            ):\n                previous = state.last_action_chain\n                state.last_action_chain = {\n                    **previous,\n                    \"state\": \"error\",\n                    \"success\": False,\n                    \"failed_actions\": int(previous.get(\"action_count\", 0)),\n                    \"error\": repr(exc),\n                }\n            try:\n                self._publish_event(\n                    \"manager.watchdog.action_chain_error\",\n                    {\n                        \"process_id\": self._process_id,\n                        \"trip_id\": trip_id,\n                        \"watchdog_id\": key[0],\n                        \"rule\": key[1],\n                        \"error\": repr(exc),\n                    },\n                )\n            except Exception:\n                pass\n        finally:\n            with self._inflight_lock:\n                self._inflight_action_keys.discard(key)\n",
          )
          replace_once(
              "src/experiment_control/processes/watchdog.py",
              "                        \"active_trip_id\": state.active_trip_id,\n                    }\n",
              "                        \"active_trip_id\": state.active_trip_id,\n                        \"last_action_chain\": state.last_action_chain,\n                    }\n",
          )

          # Backend regression tests: status serialization + callback persistence.
          replace_once(
              "tests/test_watchdog_rule_eval.py",
              "                active_trip_id=\"trip-status\",\n            )\n",
              "                active_trip_id=\"trip-status\",\n                last_action_chain={\n                    \"trip_id\": \"trip-status\",\n                    \"state\": \"completed\",\n                    \"success\": False,\n                    \"action_count\": 4,\n                    \"succeeded_actions\": 3,\n                    \"failed_actions\": 1,\n                    \"actions\": [],\n                },\n            )\n",
          )
          replace_once(
              "tests/test_watchdog_rule_eval.py",
              "        self.assertEqual(rule.get(\"active_trip_id\"), \"trip-status\")\n",
              "        self.assertEqual(rule.get(\"active_trip_id\"), \"trip-status\")\n        self.assertEqual(\n            rule.get(\"last_action_chain\"),\n            {\n                \"trip_id\": \"trip-status\",\n                \"state\": \"completed\",\n                \"success\": False,\n                \"action_count\": 4,\n                \"succeeded_actions\": 3,\n                \"failed_actions\": 1,\n                \"actions\": [],\n            },\n        )\n",
          )
          replace_once(
              "tests/test_watchdog_process_action.py",
              "import sys\nimport unittest\n",
              "import sys\nimport threading\nimport unittest\nfrom concurrent.futures import Future\n",
          )
          replace_once(
              "tests/test_watchdog_process_action.py",
              "    CommandAction,\n    ProcessAction,\n",
              "    CommandAction,\n    ProcessAction,\n    RuleState,\n",
          )
          insert_before_once(
              "tests/test_watchdog_process_action.py",
              "\n\nif __name__ == \"__main__\":\n",
              '''\n    def test_completed_action_chain_is_persisted_in_rule_state(self) -> None:\n        proc = object.__new__(WatchdogProcess)\n        key = (\"wd1\", \"r1\")\n        proc._states = {key: RuleState(last_action_chain={\"trip_id\": \"trip-1\", \"state\": \"running\"})}\n        proc._inflight_action_keys = {key}\n        proc._inflight_lock = threading.Lock()\n        proc._publish_event = lambda *_a, **_k: None  # type: ignore[method-assign]\n\n        future: Future[dict] = Future()\n        future.set_result(\n            {\n                \"trip_id\": \"trip-1\",\n                \"success\": False,\n                \"action_count\": 4,\n                \"succeeded_actions\": 3,\n                \"failed_actions\": 1,\n                \"duration_ms\": 12.5,\n                \"actions\": [\n                    {\"command\": {\"device_id\": \"hipace_eql\", \"action\": \"stop\"}, \"ok\": False}\n                ],\n            }\n        )\n\n        proc._on_action_chain_done(future, key, \"trip-1\")\n\n        self.assertNotIn(key, proc._inflight_action_keys)\n        result = proc._states[key].last_action_chain\n        self.assertIsNotNone(result)\n        assert result is not None\n        self.assertEqual(result[\"state\"], \"completed\")\n        self.assertFalse(result[\"success\"])\n        self.assertEqual(result[\"succeeded_actions\"], 3)\n        self.assertEqual(result[\"failed_actions\"], 1)\n\n''',
              "test_completed_action_chain_is_persisted_in_rule_state",
          )

          # Frontend detailed status schema/normalization.
          replace_once(
              "web/react_ui/src/features/watchdogs/watchdogStatusApi.ts",
              "export type DetailedWatchdogRule = WatchdogStatus[\"rules\"][number] & {\n  arm?: WatchdogArmStatus | null;\n  armed?: boolean;\n  confirmation?: WatchdogConfirmationStatus | null;\n  active_trip_id?: string | null;\n};\n",
              '''export type WatchdogActionChainAction = {\n  action_index: number;\n  command: Record<string, unknown>;\n  ok: boolean;\n  attempts: number;\n  error?: unknown;\n};\n\nexport type WatchdogActionChainStatus = {\n  trip_id: string | null;\n  state: \"running\" | \"completed\" | \"error\";\n  success: boolean | null;\n  action_count: number;\n  succeeded_actions: number;\n  failed_actions: number;\n  duration_ms: number | null;\n  error?: unknown;\n  actions: WatchdogActionChainAction[];\n};\n\nexport type DetailedWatchdogRule = WatchdogStatus[\"rules\"][number] & {\n  arm?: WatchdogArmStatus | null;\n  armed?: boolean;\n  confirmation?: WatchdogConfirmationStatus | null;\n  active_trip_id?: string | null;\n  last_action_chain?: WatchdogActionChainStatus | null;\n};\n''',
          )
          insert_before_once(
              "web/react_ui/src/features/watchdogs/watchdogStatusApi.ts",
              "\nexport function normalizeWatchdogStatusDetailed(raw: unknown): WatchdogStatus | null {\n",
              '''\nfunction normalizeActionChain(raw: unknown): WatchdogActionChainStatus | null {\n  const obj = asRecord(raw);\n  if (!obj) {\n    return null;\n  }\n  const actions = (Array.isArray(obj.actions) ? obj.actions : [])\n    .map((rawAction) => {\n      const action = asRecord(rawAction);\n      if (!action) {\n        return null;\n      }\n      return {\n        action_index: Math.max(0, Math.trunc(asNumber(action.action_index, 0))),\n        command: asRecord(action.command) ?? {},\n        ok: asBoolean(action.ok, false),\n        attempts: Math.max(0, Math.trunc(asNumber(action.attempts, 0))),\n        error: action.error,\n      };\n    })\n    .filter((item): item is WatchdogActionChainAction => item !== null);\n  const stateRaw = asString(obj.state, \"completed\");\n  const state: WatchdogActionChainStatus[\"state\"] =\n    stateRaw === \"running\" || stateRaw === \"error\" ? stateRaw : \"completed\";\n  const success = obj.success == null ? null : asBoolean(obj.success, false);\n  const duration = asNumber(obj.duration_ms, Number.NaN);\n  return {\n    trip_id: asString(obj.trip_id, \"\") || null,\n    state,\n    success,\n    action_count: Math.max(0, Math.trunc(asNumber(obj.action_count, actions.length))),\n    succeeded_actions: Math.max(0, Math.trunc(asNumber(obj.succeeded_actions, 0))),\n    failed_actions: Math.max(0, Math.trunc(asNumber(obj.failed_actions, 0))),\n    duration_ms: Number.isFinite(duration) ? Math.max(0, duration) : null,\n    error: obj.error,\n    actions,\n  };\n}\n\n''',
              "function normalizeActionChain(raw: unknown)",
          )
          replace_once(
              "web/react_ui/src/features/watchdogs/watchdogStatusApi.ts",
              "        active_trip_id: asString(ruleObj.active_trip_id, \"\") || null,\n",
              "        active_trip_id: asString(ruleObj.active_trip_id, \"\") || null,\n        last_action_chain: normalizeActionChain(ruleObj.last_action_chain),\n",
          )

          # Frontend: persistent, visible remediation outcome on each rule card.
          replace_once(
              "web/react_ui/src/components/WatchdogsPanel.tsx",
              "  watchdogRuleDetails,\n  type DetailedWatchdogRule,\n",
              "  watchdogRuleDetails,\n  type DetailedWatchdogRule,\n  type WatchdogActionChainStatus,\n",
          )
          insert_before_once(
              "web/react_ui/src/components/WatchdogsPanel.tsx",
              "\nexport function summarizeWatchdogRules(watchdog: WatchdogStatus): {\n",
              '''\nfunction actionCommandTarget(command: Record<string, unknown>): string {\n  const action = typeof command.action === \"string\" ? command.action : \"action\";\n  if (typeof command.device_id === \"string\" && command.device_id) {\n    return `${command.device_id}.${action}`;\n  }\n  if (typeof command.process_id === \"string\" && command.process_id) {\n    return `${command.process_id}:${action}`;\n  }\n  return action;\n}\n\nexport function actionChainPresentation(\n  rule: WatchdogStatus[\"rules\"][number]\n): { label: string; color: string; failedTargets: string[] } | null {\n  const chain: WatchdogActionChainStatus | null | undefined =\n    watchdogRuleDetails(rule).last_action_chain;\n  if (!chain) {\n    return null;\n  }\n  const noun = isBeamlineTurboRule(rule) ? \"SHUTDOWN\" : \"ACTION\";\n  if (chain.state === \"running\") {\n    return { label: `${noun} RUNNING`, color: \"blue\", failedTargets: [] };\n  }\n  const failedTargets = chain.actions\n    .filter((item) => !item.ok)\n    .map((item) => actionCommandTarget(item.command));\n  if (chain.state === \"error\") {\n    return { label: `LAST ${noun} ERROR`, color: \"red\", failedTargets };\n  }\n  if (chain.success) {\n    return {\n      label: `LAST ${noun} ${chain.succeeded_actions}/${chain.action_count} OK`,\n      color: \"teal\",\n      failedTargets: [],\n    };\n  }\n  return {\n    label: `LAST ${noun} PARTIAL · ${chain.succeeded_actions}/${chain.action_count}`,\n    color: \"red\",\n    failedTargets,\n  };\n}\n\n''',
              "export function actionChainPresentation(",
          )
          replace_once(
              "web/react_ui/src/components/WatchdogsPanel.tsx",
              "  const turboStateIncomplete = hasIncompleteBeamlineTurboState(rule);\n\n  return (\n",
              "  const turboStateIncomplete = hasIncompleteBeamlineTurboState(rule);\n  const actionChain = actionChainPresentation(rule);\n\n  return (\n",
          )
          replace_once(
              "web/react_ui/src/components/WatchdogsPanel.tsx",
              "            <Badge variant=\"light\" color={ruleState.color}>{ruleState.label}</Badge>\n            {latched && (\n",
              "            <Badge variant=\"light\" color={ruleState.color}>{ruleState.label}</Badge>\n            {actionChain && (\n              <Badge variant=\"light\" color={actionChain.color}>{actionChain.label}</Badge>\n            )}\n            {latched && (\n",
          )
          replace_once(
              "web/react_ui/src/components/WatchdogsPanel.tsx",
              "          {action && <Text size=\"xs\" fw={500}>{action}</Text>}\n",
              "          {actionChain && actionChain.failedTargets.length > 0 && (\n            <Text size=\"xs\" c=\"red\">\n              Failed target{actionChain.failedTargets.length === 1 ? \"\" : \"s\"}: {actionChain.failedTargets.join(\", \")}\n            </Text>\n          )}\n          {action && <Text size=\"xs\" fw={500}>{action}</Text>}\n",
          )

          # Frontend tests for persistent partial-result display and normalization.
          replace_once(
              "web/react_ui/src/components/WatchdogsPanel.test.ts",
              "  beamlineTurboProtectionSummary,\n  confirmationProgress,\n",
              "  actionChainPresentation,\n  beamlineTurboProtectionSummary,\n  confirmationProgress,\n",
          )
          insert_before_once(
              "web/react_ui/src/components/WatchdogsPanel.test.ts",
              "\n  it(\"shows the beamline protection as disabled when the watchdog is disabled\", () => {\n",
              '''\n  it(\"retains a partial global shutdown result and identifies the failed turbo\", () => {\n    const rule = turboRule(\"eql_pressure_turbos_off\", {\n      armed: true,\n      last_action_chain: {\n        trip_id: \"trip-1\",\n        state: \"completed\",\n        success: false,\n        action_count: 4,\n        succeeded_actions: 3,\n        failed_actions: 1,\n        duration_ms: 12.5,\n        actions: [\n          {\n            action_index: 1,\n            command: { device_id: \"hipace_eql\", action: \"stop\" },\n            ok: false,\n            attempts: 1,\n          },\n        ],\n      },\n    });\n\n    expect(actionChainPresentation(rule)).toEqual({\n      label: \"LAST SHUTDOWN PARTIAL · 3/4\",\n      color: \"red\",\n      failedTargets: [\"hipace_eql.stop\"],\n    });\n  });\n\n''',
              "retains a partial global shutdown result",
          )
          insert_before_once(
              "web/react_ui/src/features/watchdogs/watchdogStatusApi.test.ts",
              "\n  it(\"distinguishes an active trip from a recovered retained trip id\", () => {\n",
              '''\n  it(\"normalizes the persisted action-chain result\", () => {\n    const watchdog = normalizeWatchdogStatusDetailed({\n      watchdog_id: \"vacuum-cryo_watchdog\",\n      enabled: true,\n      rules: [\n        {\n          name: \"eql_pressure_turbos_off\",\n          severity: \"critical\",\n          latched: false,\n          last_action_chain: {\n            trip_id: \"trip-partial\",\n            state: \"completed\",\n            success: false,\n            action_count: 4,\n            succeeded_actions: 3,\n            failed_actions: 1,\n            duration_ms: 15.2,\n            actions: [\n              {\n                action_index: 1,\n                command: { device_id: \"hipace_eql\", action: \"stop\" },\n                ok: false,\n                attempts: 1,\n                error: \"timeout\",\n              },\n            ],\n          },\n          telemetry: [],\n          actions: [],\n        },\n      ],\n    });\n\n    const chain = watchdogRuleDetails(watchdog!.rules[0]).last_action_chain;\n    expect(chain?.state).toBe(\"completed\");\n    expect(chain?.success).toBe(false);\n    expect(chain?.succeeded_actions).toBe(3);\n    expect(chain?.failed_actions).toBe(1);\n    expect(chain?.actions[0].command.device_id).toBe(\"hipace_eql\");\n    expect(chain?.actions[0].error).toBe(\"timeout\");\n  });\n\n''',
              "normalizes the persisted action-chain result",
          )
          '@
          $patch | python -
      - name: Build packaged UI
        shell: pwsh
        run: .\scripts\build_packaged_ui.ps1
      - name: Run UI tests
        shell: pwsh
        run: npm test --prefix web/react_ui
      - name: Commit generated and source fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/experiment_control/processes/watchdog.py tests/test_watchdog_rule_eval.py tests/test_watchdog_process_action.py web/react_ui/src/features/watchdogs/watchdogStatusApi.ts web/react_ui/src/features/watchdogs/watchdogStatusApi.test.ts web/react_ui/src/components/WatchdogsPanel.tsx web/react_ui/src/components/WatchdogsPanel.test.ts src/experiment_control/_ui_dist
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Persist watchdog action-chain outcomes"
          git push origin HEAD:watchdog-independent-hornets
