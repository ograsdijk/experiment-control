name: Temporary SynthHD Review Fixes

on:
  push:
    branches: [refactor/synthhd-channel-naming-squashed]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/synthhd-channel-naming-squashed
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/experiment_control/drivers/synthhd_driver.py",
              '''            "get_reference_mode",\n            "set_reference_mode",\n            "get_reference_frequency",\n            "set_reference_frequency",\n''',
              '''            "get_reference_mode",\n            "get_reference_frequency",\n''',
          )

          replace(
              "src/experiment_control/_driver/runner.py",
              '''        try:\n            value = getattr(self._device, name)\n''',
              '''        if self._members_cache is None:\n            self._refresh_capabilities_cache()\n        spec = (self._members_cache or {}).get(name)\n        if spec is None:\n            return self._rpc_error(req_id, "Unknown member")\n        if not spec.readable:\n            return self._rpc_error(req_id, "Member is not readable")\n        try:\n            value = getattr(self._device, name)\n''',
          )

          replace(
              "src/experiment_control/_manager/device_routing.py",
              '''def _rpc_failure(code: str, message: str | None = None) -> Json:\n    return RpcResponse.failure(code, message=message).to_dict()\n''',
              '''def _rpc_failure(\n    code: str,\n    message: str | None = None,\n    *,\n    details: Any | None = None,\n) -> Json:\n    return RpcResponse.failure(code, message=message, details=details).to_dict()\n''',
          )

          replace(
              "src/experiment_control/_manager/device_routing.py",
              '''    if not ok:\n        return _rpc_failure(\n            "command_interceptor_rejected",\n            None if err is None else str(err),\n        )\n''',
              '''    if not ok:\n        message = None\n        details = err if isinstance(err, dict) else None\n        if isinstance(err, dict) and err.get("message") is not None:\n            message = str(err.get("message"))\n        elif err is not None:\n            message = str(err)\n        return _rpc_failure(\n            "command_interceptor_rejected",\n            message,\n            details=details,\n        )\n''',
          )

          replace(
              "tests/test_synthhd_driver.py",
              '''        self.assertNotIn("trigger", advertised)\n        self.assertNotIn("write", advertised)\n''',
              '''        self.assertNotIn("trigger", advertised)\n        self.assertNotIn("write", advertised)\n        self.assertNotIn("set_reference_mode", advertised)\n        self.assertNotIn("set_reference_frequency", advertised)\n''',
          )

          replace(
              "tests/test_synthhd_driver.py",
              '''        for action in ("trigger", "init", "open", "close", "read", "write", "save"):\n''',
              '''        for action in (\n            "trigger",\n            "init",\n            "open",\n            "close",\n            "read",\n            "write",\n            "save",\n            "set_reference_mode",\n            "set_reference_frequency",\n        ):\n''',
          )

          replace(
              "tests/test_synthhd_driver.py",
              '''        for name, value in (("sweep_cont", True), ("reference_mode", "external")):\n            with self.subTest(name=name):\n                response = runner._rpc_route_set(\n                    {"id": name, "params": {"name": name, "value": value}}\n                )\n                self.assertEqual(response["status"], "ERROR")\n                self.assertEqual(response["error"], "Unknown member")\n\n        self.assertFalse(driver.sweep_cont)\n''',
              '''        for name, value in (("sweep_cont", True), ("reference_mode", "external")):\n            with self.subTest(name=name):\n                response = runner._rpc_route_set(\n                    {"id": name, "params": {"name": name, "value": value}}\n                )\n                self.assertEqual(response["status"], "ERROR")\n                self.assertEqual(response["error"], "Unknown member")\n\n        for name in ("sweep_cont", "reference_mode", "set_reference_mode"):\n            with self.subTest(get_name=name):\n                response = runner._rpc_route_get(\n                    {"id": name, "params": {"name": name}}\n                )\n                self.assertEqual(response["status"], "ERROR")\n                self.assertEqual(response["error"], "Unknown member")\n\n        self.assertFalse(driver.sweep_cont)\n''',
          )

          Path("tests/test_command_interceptor_error_details.py").write_text('''from types import SimpleNamespace\n\nfrom experiment_control._manager.device_routing import _route_command\n\n\ndef test_command_interceptor_rejection_preserves_structured_error_details() -> None:\n    interceptor_error = {\n        "kind": "command_interceptor",\n        "code": "INTERCEPTOR_REJECTED",\n        "message": "frequency outside calibrated range",\n        "process_id": "laser_lock_freq_nltl_power",\n        "device_id": "synthhd",\n        "action": "set_frequency",\n        "details": {\n            "code": "FREQ_OUT_OF_RANGE",\n            "message": "outside calibration",\n            "details": {"max_hz": 2.0},\n        },\n    }\n    manager = SimpleNamespace(\n        _devices={"synthhd": SimpleNamespace(rpc_endpoint="tcp://driver")},\n        _normalize_command_source=lambda **_kwargs: ("operator", "test"),\n        _driver_is_stopped=lambda _handle: False,\n        _apply_command_interceptors=lambda _cmd, **_kwargs: (\n            False,\n            None,\n            interceptor_error,\n        ),\n    )\n\n    response = _route_command(\n        manager,\n        {\n            "device_id": "synthhd",\n            "action": "set_frequency",\n            "params": {"channel": 0, "freq_hz": 1.0},\n        },\n    )\n\n    assert response["ok"] is False\n    assert response["error"]["code"] == "command_interceptor_rejected"\n    assert response["error"]["message"] == interceptor_error["message"]\n    assert response["error"]["details"] == interceptor_error\n''')

          workflow = Path(".github/workflows/temporary_synthhd_review_fixes.yml")
          workflow.unlink()

      - name: Commit patched tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix post-squash SynthHD review findings"
          git push origin HEAD:refactor/synthhd-channel-naming-squashed
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run targeted regression tests
        run: |
          pytest tests/test_synthhd_driver.py tests/test_command_interceptor_error_details.py tests/test_synthhd_follower_example.py -q
          ruff check src/experiment_control/_driver/runner.py src/experiment_control/_manager/device_routing.py src/experiment_control/drivers/synthhd_driver.py tests/test_synthhd_driver.py tests/test_command_interceptor_error_details.py
