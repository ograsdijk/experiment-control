          $script = @'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if new in s:
                  return
              if old not in s:
                  raise RuntimeError(f"anchor missing in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # A failed historical remediation must not coexist with an "all clear"
          # top-level watchdog summary. Keep current rule state separate, but make
          # the incomplete last action an operator-attention condition.
