name: Temporary SynthHD Review Validation

on:
  push:
    branches: [refactor/synthhd-channel-naming-squashed]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/synthhd-channel-naming-squashed
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Make regression test unittest-compatible and remove helper workflow
        shell: python
        run: |
          from pathlib import Path

          Path("tests/test_command_interceptor_error_details.py").write_text('''import unittest\nfrom types import SimpleNamespace\n\nfrom experiment_control._manager.device_routing import _route_command\n\n\nclass CommandInterceptorErrorDetailsTests(unittest.TestCase):\n    def test_command_interceptor_rejection_preserves_structured_error_details(self) -> None:\n        interceptor_error = {\n            "kind": "command_interceptor",\n            "code": "INTERCEPTOR_REJECTED",\n            "message": "frequency outside calibrated range",\n            "process_id": "laser_lock_freq_nltl_power",\n            "device_id": "synthhd",\n            "action": "set_frequency",\n            "details": {\n                "code": "FREQ_OUT_OF_RANGE",\n                "message": "outside calibration",\n                "details": {"max_hz": 2.0},\n            },\n        }\n        manager = SimpleNamespace(\n            _devices={"synthhd": SimpleNamespace(rpc_endpoint="tcp://driver")},\n            _normalize_command_source=lambda **_kwargs: ("operator", "test"),\n            _driver_is_stopped=lambda _handle: False,\n            _apply_command_interceptors=lambda _cmd, **_kwargs: (\n                False,\n                None,\n                interceptor_error,\n            ),\n        )\n\n        response = _route_command(\n            manager,\n            {\n                "device_id": "synthhd",\n                "action": "set_frequency",\n                "params": {"channel": 0, "freq_hz": 1.0},\n            },\n        )\n\n        self.assertIs(response["ok"], False)\n        self.assertEqual(response["error"]["code"], "command_interceptor_rejected")\n        self.assertEqual(response["error"]["message"], interceptor_error["message"])\n        self.assertEqual(response["error"]["details"], interceptor_error)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          Path(".github/workflows/temporary_synthhd_review_validation.yml").unlink()
      - name: Commit final patched tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make SynthHD review regression part of normal CI"
          git push origin HEAD:refactor/synthhd-channel-naming-squashed
      - name: Sync dependencies
        run: uv sync
      - name: Targeted regression tests
        run: |
          uv run python -m unittest -q tests.test_synthhd_driver tests.test_command_interceptor_error_details tests.test_synthhd_follower_example
      - name: Lint changed framework files
        run: |
          uv run ruff check src/experiment_control/_driver/runner.py src/experiment_control/_manager/device_routing.py src/experiment_control/drivers/synthhd_driver.py tests/test_synthhd_driver.py tests/test_command_interceptor_error_details.py
