name: Temporary watchdog UI refresh
on:
  push:
    branches:
      - watchdog-independent-hornets
permissions:
  contents: write
jobs:
  refresh:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: watchdog-independent-hornets
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/react_ui/package-lock.json
      - name: Build packaged UI
        shell: pwsh
        run: .\scripts\build_packaged_ui.ps1
      - name: Run UI tests
        run: npm test --prefix web/react_ui
      - name: Commit generated UI
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/experiment_control/_ui_dist
          $changes = git status --porcelain -- src/experiment_control/_ui_dist
          if (-not $changes) { exit 0 }
          git commit -m "build: refresh packaged watchdog UI"
          git push origin HEAD:watchdog-independent-hornets
